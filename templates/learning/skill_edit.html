{% extends 'base.html' %}

{% block title %}Edit Skill - LearnTrack{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="card border shadow-sm rounded-4 p-4 bg-white">
        <div class="d-flex align-items-center justify-content-between mb-3 pb-3 border-bottom">
          <h4 class="fw-bold text-dark mb-0"><i class="bi bi-pencil-square text-primary me-2"></i>Edit Skill</h4>
          <a href="{% url 'skill_detail' skill.pk %}" class="btn btn-outline-secondary btn-sm">&larr; Back to Skill Details</a>
        </div>

        <form method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold small">Skill Name</label>
            {{ form.name }}
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold small">Description</label>
            {{ form.description }}
          </div>

          <div class="d-flex justify-content-end gap-2 pt-3 border-top">
            <a href="{% url 'skill_detail' skill.pk %}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary fw-semibold px-4">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
