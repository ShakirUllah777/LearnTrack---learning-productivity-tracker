{% extends 'base.html' %}

{% block title %}Edit Topic - LearnTrack{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="card border shadow-sm rounded-4 p-4 bg-white">
        <div class="d-flex align-items-center justify-content-between mb-3 pb-3 border-bottom">
          <h4 class="fw-bold text-dark mb-0"><i class="bi bi-pencil-square text-primary me-2"></i>Edit Topic</h4>
          <a href="{% url 'skill_detail' topic.skill.pk %}" class="btn btn-outline-secondary btn-sm">&larr; Back to Timeline</a>
        </div>

        <form method="POST">
          {% csrf_token %}
          <div class="row g-2 mb-3">
            <div class="col-3">
              <label class="form-label fw-semibold small">Seq #</label>
              {{ form.order }}
            </div>
            <div class="col-9">
              <label class="form-label fw-semibold small">Topic Title</label>
              {{ form.title }}
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold small">Description</label>
            {{ form.description }}
          </div>
          <div class="row g-2 mb-4">
            <div class="col-6">
              <label class="form-label fw-semibold small">Status</label>
              {{ form.status }}
            </div>
            <div class="col-6">
              <label class="form-label fw-semibold small">Date Learned</label>
              {{ form.date_learned }}
            </div>
          </div>

          <div class="d-flex justify-content-end gap-2 pt-3 border-top">
            <a href="{% url 'skill_detail' topic.skill.pk %}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary fw-semibold px-4">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
