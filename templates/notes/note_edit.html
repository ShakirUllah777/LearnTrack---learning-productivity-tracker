{% extends 'base.html' %}
{% load static %}

{% block title %}LearnTrack — Edit Note{% endblock %}

{% block content %}
<style>
  :root {
    --bg: #f3f0ff; 
    --card: #ffffff; 
    --border: #eae7f7;
    --text: #1e1b3a; 
    --muted: #7a7691;
    --accent: #6d5ef0; 
    --accent2: #a78bfa; 
    --accent-soft: #f0edfe;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(30,27,58,.04), 0 8px 24px -12px rgba(76,58,190,.18);
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background:
      radial-gradient(1100px 500px at 15% -10%, #ece7ff 0%, rgba(236,231,255,0) 60%),
      radial-gradient(900px 500px at 100% 0%, #eaf3ff 0%, rgba(234,243,255,0) 55%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .wrap-edit-note { max-width: 650px; margin: 0 auto; padding: 48px 22px 60px; }

  .edit-note-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 32px 28px; box-shadow: var(--shadow);
  }

  .edit-note-card h2 { font-size: 22px; font-weight: 800; margin: 0 0 20px; letter-spacing: -0.02em; color: var(--text); }

  .field-note { margin-bottom: 18px; }
  .field-note label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 7px; color: var(--text); }
  .field-note input[type=text], .field-note textarea {
    width: 100%; border: 1px solid var(--border); border-radius: 11px; padding: 11px 14px; font-size: 14px;
    background: #faf9ff; color: var(--text); transition: border-color .15s, box-shadow .15s;
  }
  .field-note input:focus, .field-note textarea:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: #ffffff;
  }

  .btn-row-note { display: flex; align-items: center; justify-content: space-between; margin-top: 24px; }
  .btn-save-note {
    background: linear-gradient(135deg, var(--accent), #5b4be0); color: #fff; font-weight: 700; font-size: 14px;
    padding: 11px 22px; border-radius: 11px; border: none; cursor: pointer; box-shadow: 0 6px 16px -6px rgba(109,94,240,.6);
    transition: transform .12s ease;
  }
  .btn-save-note:hover { transform: translateY(-1px); }
  .btn-cancel-note {
    padding: 11px 18px; border-radius: 11px; font-size: 13px; font-weight: 700; background: #f1f0f7; color: var(--muted);
    text-decoration: none; display: inline-block; transition: background .12s;
  }
  .btn-cancel-note:hover { background: var(--border); color: var(--text); }
</style>

<div class="wrap-edit-note">
  <div class="edit-note-card">
    <h2>{% if note %}Edit Note{% else %}New Note{% endif %}</h2>
    
    <form method="POST">
      {% csrf_token %}
      <div class="field-note">
        <label for="id_title">Note Title</label>
        <input type="text" id="id_title" name="title" value="{{ note.title|default:'' }}" placeholder="Note title…" required>
      </div>

      <div class="field-note">
        <label for="id_content">Content</label>
        <textarea id="id_content" name="content" rows="6" placeholder="Write your note…" required>{{ note.content|default:'' }}</textarea>
      </div>

      <div class="field-note">
        <label for="id_tags">Tags</label>
        <input type="text" id="id_tags" name="tags" value="{{ note.tags|default:'' }}" placeholder="Tags, comma separated (e.g. React, Backend)">
      </div>

      <div class="btn-row-note">
        <a href="{% url 'note_list' %}" class="btn-cancel-note">Cancel</a>
        <button type="submit" class="btn-save-note">Save Note</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
