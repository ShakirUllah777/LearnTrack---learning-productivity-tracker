{% extends 'base.html' %}

{% block title %}Edit Note - LearnTrack{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card border shadow-sm rounded-4 p-4 bg-white">
        <div class="d-flex align-items-center justify-content-between mb-3 pb-3 border-bottom">
          <h4 class="fw-bold text-dark mb-0"><i class="bi bi-pencil-square text-info me-2"></i>Edit Note</h4>
          <a href="{% url 'note_list' %}" class="btn btn-outline-secondary btn-sm">&larr; Back to Notes</a>
        </div>

        <form method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold small">Note Title</label>
            {{ form.title }}
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold small">Content</label>
            {{ form.content }}
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold small">Tags</label>
            {{ form.tags }}
          </div>

          <div class="d-flex justify-content-end gap-2 pt-3 border-top">
            <a href="{% url 'note_list' %}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-info text-white fw-semibold px-4">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
