{% extends 'base.html' %}

{% block title %}Edit Note — LearnTrack{% endblock %}

{% block content %}
<main class="py-5">
  <div class="wrap">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card border shadow-sm rounded-4 p-4 bg-white">
          <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom">
            <h4 class="fw-bold text-dark mb-0"><i class="bi bi-pencil-square text-primary me-2"></i>Edit Note</h4>
            <a href="{% url 'note_list' %}" class="btn btn-ghost-custom btn-sm">&larr; Back to Notes</a>
          </div>

          <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label fw-semibold small text-dark">Note Title</label>
              {{ form.title }}
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold small text-dark">Content</label>
              {{ form.content }}
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold small text-dark">Tags (comma-separated)</label>
              {{ form.tags }}
            </div>

            <div class="d-flex justify-content-end gap-2 pt-3 border-top">
              <a href="{% url 'note_list' %}" class="btn btn-ghost-custom">Cancel</a>
              <button type="submit" class="btn btn-indigo px-4">Save Changes</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>
{% endblock %}
