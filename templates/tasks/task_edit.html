{% extends 'base.html' %}
{% load static %}

{% block title %}LearnTrack — Edit Task{% endblock %}

{% block content %}
<style>
  :root {
    --bg: #f3f0ff; 
    --card: #ffffff; 
    --border: #eae7f7;
    --text: #1e1b3a; 
    --muted: #7a7691;
    --accent: #6d5ef0; 
    --accent2: #a78bfa; 
    --accent-soft: #f0edfe;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(30,27,58,.04), 0 8px 24px -12px rgba(76,58,190,.18);
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background:
      radial-gradient(1100px 500px at 15% -10%, #ece7ff 0%, rgba(236,231,255,0) 60%),
      radial-gradient(900px 500px at 100% 0%, #eaf3ff 0%, rgba(234,243,255,0) 55%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .wrap-edit { max-width: 600px; margin: 0 auto; padding: 48px 22px 60px; }

  .edit-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 32px 28px; box-shadow: var(--shadow);
  }

  .edit-card h2 { font-size: 22px; font-weight: 800; margin: 0 0 20px; letter-spacing: -0.02em; color: var(--text); }

  .field-edit { margin-bottom: 18px; }
  .field-edit label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 7px; color: var(--text); }
  .field-edit input[type=text], .field-edit input[type=date], .field-edit select, .field-edit textarea {
    width: 100%; border: 1px solid var(--border); border-radius: 11px; padding: 11px 14px; font-size: 14px;
    background: #faf9ff; color: var(--text); transition: border-color .15s, box-shadow .15s;
  }
  .field-edit input:focus, .field-edit select:focus, .field-edit textarea:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: #ffffff;
  }

  .btn-row { display: flex; align-items: center; justify-content: space-between; margin-top: 24px; }
  .btn-save {
    background: linear-gradient(135deg, var(--accent), #5b4be0); color: #fff; font-weight: 700; font-size: 14px;
    padding: 11px 22px; border-radius: 11px; border: none; cursor: pointer; box-shadow: 0 6px 16px -6px rgba(109,94,240,.6);
    transition: transform .12s ease;
  }
  .btn-save:hover { transform: translateY(-1px); }
  .btn-cancel {
    padding: 11px 18px; border-radius: 11px; font-size: 13px; font-weight: 700; background: #f1f0f7; color: var(--muted);
    text-decoration: none; display: inline-block; transition: background .12s;
  }
  .btn-cancel:hover { background: var(--border); color: var(--text); }
</style>

<div class="wrap-edit">
  <div class="edit-card">
    <h2>Edit Task</h2>
    
    <form method="POST">
      {% csrf_token %}
      <div class="field-edit">
        <label for="id_title">Task Title</label>
        <input type="text" id="id_title" name="title" value="{{ task.title }}" required>
      </div>

      <div class="field-edit">
        <label for="id_description">Description</label>
        <textarea id="id_description" name="description" rows="3" placeholder="Optional task description or details...">{{ task.description }}</textarea>
      </div>

      <div class="field-edit">
        <label for="id_priority">Priority</label>
        <select id="id_priority" name="priority">
          <option value="HIGH" {% if task.priority == 'HIGH' %}selected{% endif %}>High</option>
          <option value="MEDIUM" {% if task.priority == 'MEDIUM' %}selected{% endif %}>Medium</option>
          <option value="LOW" {% if task.priority == 'LOW' %}selected{% endif %}>Low</option>
        </select>
      </div>

      <div class="field-edit">
        <label for="id_status">Status</label>
        <select id="id_status" name="status">
          <option value="PENDING" {% if task.status == 'PENDING' %}selected{% endif %}>Pending</option>
          <option value="IN_PROGRESS" {% if task.status == 'IN_PROGRESS' %}selected{% endif %}>In progress</option>
          <option value="COMPLETED" {% if task.status == 'COMPLETED' %}selected{% endif %}>Completed</option>
        </select>
      </div>

      <div class="field-edit">
        <label for="id_due_date">Due Date</label>
        <input type="date" id="id_due_date" name="due_date" value="{{ task.due_date|date:'Y-m-d' }}">
      </div>

      <div class="btn-row">
        <a href="{% url 'task_list' %}" class="btn-cancel">Cancel</a>
        <button type="submit" class="btn-save">Save Task</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
